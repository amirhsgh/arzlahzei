services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arzlahzei_app
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "14000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - arzlahzei
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/auth/csrf"]
      interval: 30s
      timeout: 5s
      retries: 3

  cron:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arzlahzei_cron
    restart: unless-stopped
    env_file: .env.production
    command: ["node", "scripts/cron-runner.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - arzlahzei

  postgres:
    image: postgres:16-alpine
    container_name: arzlahzei_postgres
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arzlahzei

  redis:
    image: redis:7-alpine
    container_name: arzlahzei_redis
    restart: unless-stopped
    env_file: .env.production
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - arzlahzei

volumes:
  postgres_data:
  redis_data:

networks:
  arzlahzei:
    driver: bridge
